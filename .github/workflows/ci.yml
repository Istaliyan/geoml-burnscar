name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: geoml_test
          POSTGRES_USER: geoml
          POSTGRES_PASSWORD: geoml_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoml -d geoml_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GEOML_TEST_DATABASE_URL: postgresql+psycopg://geoml:geoml_ci_only@localhost:5432/geoml_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install raster system library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libexpat1
      - name: Install package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest
